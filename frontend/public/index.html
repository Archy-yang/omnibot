<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniBot - 全平台智能助手</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="chat-container">
        <!-- Header -->
        <header class="chat-header">
            <h1>OmniBot</h1>
            <p class="subtitle">全平台智能助手</p>
        </header>

        <!-- Messages Area -->
        <main class="chat-messages" id="chat-messages">
            <div class="message assistant">
                <div class="message-content">
                    你好！我是 OmniBot，有什么可以帮你的吗？
                </div>
            </div>
        </main>

        <!-- Input Area -->
        <footer class="chat-input-container">
            <div class="hint">
                💡 提示：可以用 <code>#设置Key sk-xxx</code> 配置自己的 OpenAI API Key
            </div>
            <form class="chat-form" id="chat-form">
                <input
                    type="text"
                    id="message-input"
                    placeholder="输入消息..."
                    autocomplete="off"
                    autofocus
                >
                <button type="submit" id="send-button">发送</button>
            </form>
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
