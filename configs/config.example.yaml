# OmniBot 配置示例
#
# 用法:复制本文件为 configs/config.yaml,再填入本地真实凭证。
# configs/config.yaml 已在 .gitignore,不会进 git。
#
# 本示例覆盖:Web / 微信公众号 / 飞书机器人 三入口 + LLM + DB。

# 应用配置
app:
  name: "omnibot"
  env: "development"
  port: 8080

# 数据库配置
# 开发可用 sqlite 内存库快速起步;生产推荐 Postgres。
database:
  driver: "postgres"  # sqlite / postgres
  dsn: "host=localhost port=5433 user=test password=test123 dbname=omnibot_test sslmode=disable"
  max_conns: 25
  # 备选:sqlite 内存库
  # driver: "sqlite"
  # dsn: "file::memory:?cache=shared"

# 微信公众号配置(v1.9 已解耦 XML;测试号或正式号均可)
# 不接入留占位即可,不影响其他入口
wechat:
  app_id: "your_wechat_app_id"
  app_secret: "your_wechat_app_secret"
  token: "your_wechat_token"
  encoding_aes_key: "your_wechat_encoding_aes_key"
  callback_url: "https://your-domain.com/wechat/callback"

# 飞书机器人配置(v1.6 长连接接入)
# 凭证从飞书开放平台「凭证与基础信息」获取:
#   - app_id 形如 cli_xxx
#   - app_secret 在凭证页点「显示」
# enabled=false 时跳过初始化,不影响其他入口。
feishu:
  app_id: "cli_xxx"
  app_secret: "your_feishu_app_secret"
  enabled: false

# 大模型配置(v1.4+ 用户可在 Web 设置面板自定义,覆盖此处 system default)
# 推荐 DeepSeek / 豆包 / 千问等 OpenAI 兼容服务商,本地仅占位即可。
llm:
  providers:
    openai:
      api_key: ""  # 留空让用户走 Web UI 配自定义
      base_url: "https://api.openai.com/v1"
      model: "gpt-4o-mini"
      timeout: "30s"

  routing:
    default: "openai"
    fallback_order: []

# 记忆系统配置
memory:
  extraction:
    enabled: true
    batch_size: 10

  # 向量化服务(12-记忆系统技术方案 §5.3)
  # provider 留空 = 关闭语义检索,记忆检索降级为子串匹配(记忆照常存取)
  # embedding:
  #   provider: "openai_compatible"            # openai_compatible | ollama
  #   base_url: "https://qianfan.baidubce.com/v2"  # 千帆v2/DashScope/SiliconFlow 等 OpenAI 兼容端点
  #   api_key: "your_embedding_api_key"
  #   model: "bge-large-zh"
  #   dims: 1024                               # 必须与模型实际维度一致,启动校验
  #   timeout: "10s"
  # 本地 Ollama 示例(先 ollama pull qwen3-embedding:0.6b):
  # embedding:
  #   provider: "ollama"
  #   base_url: "http://localhost:11434"
  #   model: "qwen3-embedding:0.6b"
  #   dims: 1024

  storage:
    vector_db:
      url: "your_vector_db_url"
      api_key: "your_vector_db_key"

    postgres:
      dsn: "your_postgres_dsn"
      max_conns: 20

# Redis 配置(可选)
redis:
  url: "redis://localhost:6379/0"
  pool_size: 10

# 日志配置
logger:
  level: "debug"  # production 改 info
  format: "text"  # production 改 json
  output: "stdout"

# 后台 Agent 框架(08):子 Agent 可见工具的能力白名单。
# 非敏感数据。request_input(interactive)为强制基线恒可见,其余工具需在能力标签 ∩ 此白名单内。
agent:
  sub_agent:
    allowed_capabilities: ["research", "interactive"]
    timeout: "180s"

# 认证配置(v2.1 邮箱密码登录)
# jwt_secret 生产必须改为强随机值(建议 ≥32 字符),不要提交到 git;
# token_ttl 使用 time.ParseDuration 语法,720h = 30 天(对齐 PRD 5.3)。
auth:
  jwt_secret: "change-me-in-production-to-a-32-plus-char-random-string"
  token_ttl: "720h"
