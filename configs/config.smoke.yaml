# OmniBot 本地开发配置——含真实凭证,严禁提交到 git。
# 此文件已在 .gitignore 排除。

app:
  name: "omnibot"
  env: "development"
  port: 8080

# 数据库:Postgres docker 实例(localhost:5433)
database:
  driver: "sqlite"
  dsn: "file:smoke_p2.db?cache=shared"
  max_conns: 10

# 微信(暂不测试,占位)
wechat:
  app_id: "your_wechat_app_id"
  app_secret: "your_wechat_app_secret"
  token: "your_wechat_token"
  encoding_aes_key: "your_wechat_encoding_aes_key"
  callback_url: "https://your-domain.com/wechat/callback"

# 飞书机器人 — v1.11 smoke Phase 3
feishu:
  app_id: "cli_aaca2d8cb0a15ce1"
  app_secret: "y8yA03olVEcQt3SRByhKddLU6CWqxj4K"
  enabled: true

# LLM:占位即可,真实凭证走 Web 设置面板(v1.4+ 用户自定义,加密落 user_llm_configs 表)
llm:
  providers:
    openai:
      api_key: ""
      base_url: "https://api.openai.com/v1"
      model: "gpt-4o-mini"
      timeout: "30s"
  routing:
    default: "openai"
    fallback_order: []

memory:
  extraction:
    enabled: true
    batch_size: 10
  storage:
    vector_db:
      url: ""
      api_key: ""
    postgres:
      dsn: ""
      max_conns: 20

redis:
  url: "redis://localhost:6379/0"
  pool_size: 10

logger:
  level: "debug"
  format: "text"
  output: "stdout"

# 认证配置(v2.1)
auth:
  jwt_secret: "dev-local-jwt-secret-32-chars-min-len-ok!"
  token_ttl: "720h"
