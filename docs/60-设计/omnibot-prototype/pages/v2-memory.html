<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniBot V2.0 - 记忆管理</title>
    <style id="theme-vars">
/* OmniBot v1.10.0 品牌样式 — 基于实际代码提取 */
:root {
  /* 主强调色 */
  --color-accent: #10a37f;
  --color-accent-hover: #0d8c6d;
  --color-accent-light: rgba(16, 163, 127, 0.08);

  /* 输入框聚焦蓝 */
  --color-focus-blue: #2080f0;
  --color-focus-blue-light: rgba(32, 128, 240, 0.1);
  --color-focus-blue-hover: #4dabff;

  /* 背景色 */
  --color-bg-main: #ffffff;
  --color-bg-sidebar: #f9f9f9;
  --color-bg-user-msg: #f4f4f4;
  --color-bg-input: #ffffff;
  --color-bg-code: #f4f4f4;

  /* 文字色 */
  --color-text-primary: #0d0d0d;
  --color-text-secondary: #6e6e80;
  --color-text-tertiary: #8e8ea0;
  --color-text-hint: #9ca3af;

  /* 边框色 */
  --color-border: #e5e5e5;
  --color-border-input: #e5e7eb;

  /* 按钮色 */
  --color-btn-send-active: #000000;
  --color-btn-send-disabled: #e5e5e5;
  --color-icon: #5d5d6e;

  /* Toast */
  --color-toast-bg: #1a1a1a;
  --color-toast-text: #f4f4f5;

  /* 辅助头像 */
  --color-avatar-user: #5436da;
  --color-avatar-assistant-start: #2080f0;
  --color-avatar-assistant-end: #4dabff;
  --color-avatar-user-sidebar: #5b9bd5;
  --color-logo: #19c37d;

  /* 语义色 */
  --color-success: #10b981;
  --color-warning: #f59e0b;
  --color-error: #ef4444;
  --color-info: #3b82f6;
  --color-link: #2563eb;

  /* 字体 */
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-mono: 'SF Mono', 'Fira Code', 'Fira Mono', 'Roboto Mono', 'Monaco', 'Menlo', 'Courier New', monospace;

  /* 圆角 */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-2xl: 22px;
  --radius-full: 9999px;

  /* 阴影 */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
  --shadow-toast: 0 8px 24px rgba(0, 0, 0, 0.18), 0 2px 4px rgba(0, 0, 0, 0.06);

  /* 过渡 */
  --transition-fast: 150ms ease;
  --transition-normal: 200ms ease;
  --transition-slow: 300ms ease;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-accent: var(--color-accent);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body>
    <main class="main-page">
      <!-- ====== 背景主页面 ====== -->

      <!-- 顶部导航栏 -->
      <nav class="top-nav">
        <div class="nav-brand">
          <div class="nav-brand-logo">O</div>
          <span>OmniBot</span>
        </div>
        <div class="nav-actions">
          <!-- 记忆按钮（激活态） -->
          <button class="nav-action-btn active" title="记忆管理">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
              <line x1="8" y1="7" x2="16" y2="7"/>
              <line x1="8" y1="11" x2="14" y2="11"/>
            </svg>
          </button>
          <!-- 设置按钮 -->
          <button class="nav-action-btn" title="设置">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </button>
        </div>
      </nav>

      <!-- 主内容区 — 空状态 -->
      <div class="main-content">
        <div class="empty-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2z"/>
            <path d="M12 16v-4"/>
            <path d="M12 8h.01"/>
          </svg>
        </div>
        <div class="empty-title">你好，我是 OmniBot</div>
        <div class="empty-subtitle">有什么可以帮你的？</div>
        <input class="empty-input" type="text" placeholder="给 OmniBot 发送消息..." />
      </div>
    </main>

    <!-- ====== 遮罩层 ====== -->
    <div class="drawer-overlay"></div>

    <!-- ====== 右侧抽屉 — 记忆管理 ====== -->
    <aside class="drawer">
      <!-- 标题栏 -->
      <div class="drawer-header">
        <span class="drawer-title">记忆</span>
        <button class="drawer-close" title="关闭">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <!-- 抽屉滚动内容 -->
      <div class="drawer-body">
        <!-- 安全提醒条 -->
        <div class="safety-bar">
          <svg class="safety-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
            <line x1="12" y1="9" x2="12" y2="13"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
          <span class="safety-text">请不要保存密码、API Key、身份证号等敏感信息</span>
        </div>

        <!-- 新增记忆区 -->
        <div class="memory-input-section">
          <textarea class="memory-textarea" placeholder="输入希望助手长期记住的偏好、背景或项目说明..." maxlength="200"></textarea>
          <div class="memory-toolbar">
            <span class="char-count">0 / 200</span>
            <button class="add-btn">添加</button>
          </div>
        </div>

        <!-- 记忆列表区 -->
        <div class="memory-list-section">
          <div class="memory-list-header">
            <span class="memory-list-title">已保存的记忆</span>
            <div class="memory-list-meta">
              <span class="memory-count">4 条</span>
              <button class="clear-all-btn">清空全部</button>
            </div>
          </div>

          <div class="memory-list">
            <!-- 记忆卡片 1 -->
            <div class="memory-card">
              <div class="memory-index">1</div>
              <div class="memory-content">
                <div class="memory-text">我是 Go 开发者，擅长后端架构设计</div>
                <div class="memory-time">2026-06-20 10:15</div>
              </div>
              <div class="memory-actions">
                <button class="memory-action-btn edit-btn" title="编辑">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                  </svg>
                </button>
                <button class="memory-action-btn delete-btn" title="删除">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"/>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                    <line x1="10" y1="11" x2="10" y2="17"/>
                    <line x1="14" y1="11" x2="14" y2="17"/>
                  </svg>
                </button>
              </div>
            </div>

            <!-- 记忆卡片 2 -->
            <div class="memory-card">
              <div class="memory-index">2</div>
              <div class="memory-content">
                <div class="memory-text">项目使用 PostgreSQL 作为主数据库</div>
                <div class="memory-time">2026-06-22 09:30</div>
              </div>
              <div class="memory-actions">
                <button class="memory-action-btn edit-btn" title="编辑">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                  </svg>
                </button>
                <button class="memory-action-btn delete-btn" title="删除">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"/>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                    <line x1="10" y1="11" x2="10" y2="17"/>
                    <line x1="14" y1="11" x2="14" y2="17"/>
                  </svg>
                </button>
              </div>
            </div>

            <!-- 记忆卡片 3（编辑状态） -->
            <div class="memory-card editing">
              <div class="memory-index editing-index">3</div>
              <div class="memory-content editing-content">
                <textarea class="memory-edit-textarea">偏好使用 TypeScript 进行前端开发</textarea>
                <div class="memory-edit-toolbar">
                  <span class="char-count">18 / 200</span>
                  <div class="memory-edit-actions">
                    <button class="edit-cancel-btn">取消</button>
                    <button class="edit-save-btn">保存</button>
                  </div>
                </div>
              </div>
            </div>

            <!-- 记忆卡片 4 -->
            <div class="memory-card">
              <div class="memory-index">4</div>
              <div class="memory-content">
                <div class="memory-text">部署环境使用 Docker + Kubernetes</div>
                <div class="memory-time">2026-06-28 14:30</div>
              </div>
              <div class="memory-actions">
                <button class="memory-action-btn edit-btn" title="编辑">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                  </svg>
                </button>
                <button class="memory-action-btn delete-btn" title="删除">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"/>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                    <line x1="10" y1="11" x2="10" y2="17"/>
                    <line x1="14" y1="11" x2="14" y2="17"/>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </aside>
    <script>lucide.createIcons();</script>

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }

      /* ====== 全局样式 ====== */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        background: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
        font-size: 15px;
        line-height: 1.6;
        color: #171717;
      }

      /* ====== 背景主页面 ====== */
      .main-page {
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
        background: #fafafa;
      }

      /* 顶部导航栏 */
      .top-nav {
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        background: #ffffff;
        border-bottom: 1px solid #f0f0f0;
        flex-shrink: 0;
      }

      .nav-brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 16px;
        font-weight: 600;
        color: #171717;
      }

      .nav-brand-logo {
        width: 28px;
        height: 28px;
        background: #10a37f;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 14px;
        font-weight: 700;
      }

      .nav-actions {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .nav-action-btn {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        border: none;
        background: transparent;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #999;
        transition: all var(--transition-fast);
      }

      .nav-action-btn:hover {
        background: #f5f5f5;
        color: #666;
      }

      .nav-action-btn.active {
        color: #10a37f;
        background: rgba(16, 163, 127, 0.08);
      }

      /* 主内容区 — 空状态 */
      .main-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
      }

      .empty-icon {
        width: 48px;
        height: 48px;
        background: #10a37f;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        margin-bottom: 16px;
      }

      .empty-title {
        font-size: 22px;
        font-weight: 600;
        color: #171717;
        margin-bottom: 6px;
      }

      .empty-subtitle {
        font-size: 14px;
        color: #999;
        margin-bottom: 24px;
      }

      .empty-input {
        width: 100%;
        max-width: 600px;
        padding: 12px 16px;
        border: 1px solid #e5e5e5;
        border-radius: 12px;
        font-size: 14px;
        color: #171717;
        background: #ffffff;
        outline: none;
        transition: border-color var(--transition-fast);
      }

      .empty-input::placeholder {
        color: #ccc;
      }

      .empty-input:focus {
        border-color: #10a37f;
        box-shadow: 0 0 0 2px rgba(16, 163, 127, 0.08);
      }

      /* ====== 遮罩层 ====== */
      .drawer-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.2);
        z-index: 100;
        animation: fadeIn 0.25s ease forwards;
      }

      /* ====== 右侧抽屉 ====== */
      .drawer {
        position: fixed;
        top: 0;
        right: 0;
        width: 400px;
        height: 100vh;
        background: #ffffff;
        border-left: 1px solid #f0f0f0;
        z-index: 101;
        display: flex;
        flex-direction: column;
        animation: slideIn 0.25s ease forwards;
        overflow: hidden;
      }

      /* 抽屉标题栏 */
      .drawer-header {
        padding: 20px 24px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
      }

      .drawer-title {
        font-size: 18px;
        font-weight: 600;
        color: #171717;
      }

      .drawer-close {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        border: none;
        background: transparent;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #999;
        transition: all var(--transition-fast);
      }

      .drawer-close:hover {
        background: #f5f5f5;
        color: #666;
      }

      /* 抽屉内容滚动区 */
      .drawer-body {
        flex: 1;
        overflow-y: auto;
        padding: 0 24px 32px;
      }

      /* 安全提醒条 */
      .safety-bar {
        padding: 10px 12px;
        background: #fffbeb;
        border-left: 3px solid #f59e0b;
        border-radius: 0 8px 8px 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .safety-icon {
        flex-shrink: 0;
        color: #f59e0b;
      }

      .safety-text {
        font-size: 13px;
        color: #92400e;
        line-height: 1.4;
      }

      /* 新增记忆区 */
      .memory-input-section {
        margin-top: 20px;
      }

      .memory-textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #e5e5e5;
        border-radius: 8px;
        font-size: 14px;
        color: #171717;
        font-family: inherit;
        line-height: 1.5;
        min-height: 80px;
        resize: vertical;
        outline: none;
        transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
      }

      .memory-textarea::placeholder {
        color: #ccc;
      }

      .memory-textarea:focus {
        border-color: #10a37f;
        box-shadow: 0 0 0 2px rgba(16, 163, 127, 0.08);
      }

      .memory-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 8px;
      }

      .char-count {
        font-size: 12px;
        color: #ccc;
      }

      .add-btn {
        padding: 6px 16px;
        background: #10a37f;
        color: #ffffff;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-family: inherit;
        cursor: pointer;
        transition: background var(--transition-fast);
      }

      .add-btn:hover {
        background: #0d8c6d;
      }

      /* 记忆列表区 */
      .memory-list-section {
        margin-top: 20px;
      }

      .memory-list-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .memory-list-title {
        font-size: 14px;
        font-weight: 600;
        color: #171717;
      }

      .memory-list-meta {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .memory-count {
        font-size: 12px;
        color: #ccc;
      }

      .clear-all-btn {
        font-size: 12px;
        color: #ef4444;
        background: none;
        border: none;
        cursor: pointer;
        font-family: inherit;
        transition: text-decoration var(--transition-fast);
      }

      .clear-all-btn:hover {
        text-decoration: underline;
      }

      .memory-list {
        margin-top: 8px;
      }

      /* 单条记忆卡片 */
      .memory-card {
        padding: 12px 14px;
        border: 1px solid #f0f0f0;
        border-radius: 8px;
        margin-bottom: 6px;
        display: flex;
        align-items: flex-start;
        gap: 10px;
        transition: background var(--transition-fast), border-color var(--transition-fast);
      }

      .memory-card:hover {
        background: #fafafa;
        border-color: #e5e5e5;
      }

      .memory-index {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #f0f0f0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        color: #999;
        flex-shrink: 0;
        margin-top: 1px;
      }

      .memory-content {
        flex: 1;
        min-width: 0;
      }

      .memory-text {
        font-size: 14px;
        color: #333;
        line-height: 1.5;
      }

      .memory-time {
        font-size: 11px;
        color: #ccc;
        margin-top: 4px;
      }

      .memory-actions {
        display: flex;
        align-items: center;
        gap: 2px;
        flex-shrink: 0;
      }

      .memory-action-btn {
        width: 24px;
        height: 24px;
        border-radius: 4px;
        border: none;
        background: transparent;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ccc;
        transition: all var(--transition-fast);
      }

      .memory-action-btn.edit-btn:hover {
        color: #999;
        background: #f5f5f5;
      }

      .memory-action-btn.delete-btn:hover {
        color: #ef4444;
        background: #fef2f2;
      }

      /* ====== 编辑状态样式 ====== */
      .memory-card.editing {
        background: #fafafa;
        border-color: #e5e5e5;
        flex-direction: row;
      }

      .memory-card.editing .editing-index {
        background: #10a37f;
        color: white;
      }

      .memory-card.editing .editing-content {
        flex: 1;
        min-width: 0;
      }

      .memory-edit-textarea {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #e5e5e5;
        border-radius: 6px;
        font-size: 14px;
        color: #171717;
        font-family: inherit;
        line-height: 1.5;
        min-height: 48px;
        resize: vertical;
        outline: none;
        background: #ffffff;
        transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
      }

      .memory-edit-textarea:focus {
        border-color: #10a37f;
        box-shadow: 0 0 0 2px rgba(16, 163, 127, 0.08);
      }

      .memory-edit-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 8px;
      }

      .memory-edit-actions {
        display: flex;
        gap: 6px;
      }

      .edit-cancel-btn {
        padding: 4px 12px;
        background: #f5f5f5;
        border: none;
        border-radius: 6px;
        font-size: 13px;
        font-family: inherit;
        color: #666;
        cursor: pointer;
        transition: background var(--transition-fast);
      }

      .edit-cancel-btn:hover {
        background: #ebebeb;
      }

      .edit-save-btn {
        padding: 4px 12px;
        background: #10a37f;
        border: none;
        border-radius: 6px;
        font-size: 13px;
        font-family: inherit;
        color: white;
        cursor: pointer;
        transition: background var(--transition-fast);
      }

      .edit-save-btn:hover {
        background: #0d8c6d;
      }

      /* ====== 抽屉动画 ====== */
      @keyframes slideIn {
        from { transform: translateX(100%); }
        to { transform: translateX(0); }
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
    </style>
</body>
</html>
