<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniBot - 聊天</title>
    <style id="theme-vars">
/* OmniBot v1.10.0 品牌样式 — 基于实际代码提取 */
:root {
  /* 主强调色 */
  --color-accent: #10a37f;
  --color-accent-hover: #0d8c6d;
  --color-accent-light: rgba(16, 163, 127, 0.08);

  /* 输入框聚焦蓝 */
  --color-focus-blue: #2080f0;
  --color-focus-blue-light: rgba(32, 128, 240, 0.1);
  --color-focus-blue-hover: #4dabff;

  /* 背景色 */
  --color-bg-main: #ffffff;
  --color-bg-sidebar: #f9f9f9;
  --color-bg-user-msg: #f4f4f4;
  --color-bg-input: #ffffff;
  --color-bg-code: #f4f4f4;

  /* 文字色 */
  --color-text-primary: #0d0d0d;
  --color-text-secondary: #6e6e80;
  --color-text-tertiary: #8e8ea0;
  --color-text-hint: #9ca3af;

  /* 边框色 */
  --color-border: #e5e5e5;
  --color-border-input: #e5e7eb;

  /* 按钮色 */
  --color-btn-send-active: #000000;
  --color-btn-send-disabled: #e5e5e5;
  --color-icon: #5d5d6e;

  /* Toast */
  --color-toast-bg: #1a1a1a;
  --color-toast-text: #f4f4f5;

  /* 辅助头像 */
  --color-avatar-user: #5436da;
  --color-avatar-assistant-start: #2080f0;
  --color-avatar-assistant-end: #4dabff;
  --color-avatar-user-sidebar: #5b9bd5;
  --color-logo: #19c37d;

  /* 语义色 */
  --color-success: #10b981;
  --color-warning: #f59e0b;
  --color-error: #ef4444;
  --color-info: #3b82f6;
  --color-link: #2563eb;

  /* 字体 */
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-mono: 'SF Mono', 'Fira Code', 'Fira Mono', 'Roboto Mono', 'Monaco', 'Menlo', 'Courier New', monospace;

  /* 圆角 */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-2xl: 22px;
  --radius-full: 9999px;

  /* 阴影 */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
  --shadow-toast: 0 8px 24px rgba(0, 0, 0, 0.18), 0 2px 4px rgba(0, 0, 0, 0.06);

  /* 过渡 */
  --transition-fast: 150ms ease;
  --transition-normal: 200ms ease;
  --transition-slow: 300ms ease;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-accent: var(--color-accent);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body>

    <!-- ====== 侧边栏 ====== -->

      </div>

      <!-- 菜单区域 -->

        <!-- 新聊天 -->

        <!-- 图片 -->

          <span>设置</span>

      <!-- 历史列表区域 -->
      <div class="sidebar-history">
        <div class="history-title">你的聊天</div>
        <div class="history-item">Feishu 插件重复问题</div>
        <div class="history-item">OpenClaw在中国应用</div>
        <div class="history-item">macOS 系统数据解释</div>
        <div class="history-item">Go版本升级方法</div>
        <div class="history-item">Claude 配置 DeepSeek</div>
      </div>

      <!-- 底部用户信息区 -->
      <div class="sidebar-user">
        <button class="user-btn">
          <!-- 用户头像 -->

          <!-- 用户名和版本 -->
          <div class="user-info">
            <span class="user-name">用户</span>
            <span class="user-plan">免费版</span>
          </div>
        </button>
      </div>

    </aside>

    <!-- ====== 主内容区 ====== -->
    <main class="main-content">

      <!-- 顶栏 -->
      <div class="top-bar">
        <!-- 模型选择器 -->
        <div class="model-selector">
          <span class="title">OmniBot</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </div>
        <!-- 右侧占位 -->
        <div class="top-bar-right"></div>
        <!-- 对话气泡图标按钮 -->
        <button class="chat-bubble-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>

      <!-- 空状态欢迎区 -->

        <!-- 绿色圆形 Logo -->
        <div class="welcome-logo">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none">

          </svg>
        </div>
        <!-- 标题 -->
        <div class="welcome-title">准备好了，随时开始</div>
        <!-- 副标题 -->
        <div class="welcome-subtitle">有什么可以帮你的吗？</div>

        <!-- 提示卡片网格 -->
        <div class="prompt-grid">
          <!-- 卡片1 -->
          <div class="prompt-card">
            <div class="card-title">解释一个概念</div>
            <div class="card-desc">用通俗的语言解释「量子纠缠」</div>
          </div>
          <!-- 卡片2 -->
          <div class="prompt-card">
            <div class="card-title">写一段代码</div>
            <div class="card-desc">用 TypeScript 实现一个防抖函数</div>
          </div>
          <!-- 卡片3 -->
          <div class="prompt-card">
            <div class="card-title">帮我润色文案</div>
            <div class="card-desc">帮我把这段产品介绍写得更专业</div>
          </div>
          <!-- 卡片4 -->
          <div class="prompt-card">
            <div class="card-title">翻译并讲解</div>
            <div class="card-desc">翻译这段英文并解释难点词汇</div>
          </div>
        </div>
      </div>

      <!-- 底部输入区 -->
      <div class="input-area">
        <!-- 输入框容器 -->
        <div class="input-container">
          <textarea rows="1" placeholder="有问题，尽管问"></textarea>
          <!-- 底部工具栏 -->
          <div class="input-toolbar">
            <div class="toolbar-left"></div>
            <div class="toolbar-right">
              <!-- 语音按钮 -->
              <button class="voice-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                  <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                  <line x1="12" y1="19" x2="12" y2="23"/>
                  <line x1="8" y1="23" x2="16" y2="23"/>
                </svg>
              </button>
              <!-- 发送按钮（禁用态） -->
              <button class="send-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="22" y1="2" x2="11" y2="13"/>
                  <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
        <!-- 底部免责提示 -->
        <div class="input-disclaimer">AI可能会犯错，重要信息请核实</div>
      </div>

    </main>

  </div>

    <style>
    /* 全局样式重置 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif);
      font-size: 15px;
      line-height: 1.7;
      overflow: hidden;
      height: 100vh;
      color: #0d0d0d;
    }

    /* 主布局：左右 flex */
    .app-layout {
      display: flex;
      height: 100%;
      width: 100%;
    }

    /* ========== 侧边栏 ========== */
    .sidebar {
      width: 260px;
      min-width: 260px;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border-right: 1px solid rgba(0, 0, 0, 0.05);
    }

    /* 侧边栏顶部区域 */
    .sidebar-top {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
    }

    /* Logo 按钮 */
    .logo-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #10a37f;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* 折叠按钮 */
    .collapse-btn {
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      color: #6e6e80;
    }
    .collapse-btn:hover {
      background: rgba(0, 0, 0, 0.05);
    }

    /* 菜单区域 */
    .sidebar-menu {
      padding: 4px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    /* 单个菜单项 */
    .menu-item {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      color: #0d0d0d;
      text-decoration: none;
      transition: background 150ms;
    }
    .menu-item:hover {
      background: rgba(0, 0, 0, 0.05);
    }
    .menu-item svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      color: #6e6e80;
    }

    /* 历史列表区域 */
    .sidebar-history {
      flex: 1;
      overflow-y: auto;
      padding: 16px 8px 8px;
    }

    .history-title {
      font-size: 12px;
      color: #8e8ea0;
      font-weight: 500;
      padding: 0 12px;
      margin-bottom: 6px;
    }

    /* 单条历史记录 */
    .history-item {
      font-size: 14px;
      color: #0d0d0d;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background 150ms;
    }
    .history-item:hover {
      background: rgba(0, 0, 0, 0.05);
    }

    /* 底部用户信息区 */
    .sidebar-user {
      border-top: 1px solid rgba(0, 0, 0, 0.05);
      padding: 8px;
    }

    .user-btn {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 10px;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      border: none;
      background: transparent;
      width: 100%;
      transition: background 150ms;
    }
    .user-btn:hover {
      background: rgba(0, 0, 0, 0.05);
    }

    /* 用户头像 */
    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #5b9bd5;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      flex-shrink: 0;
    }

    /* 用户信息文字 */
    .user-info {
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .user-name {
      font-size: 14px;
      font-weight: 600;
      color: #0d0d0d;
      line-height: 1.3;
    }
    .user-plan {
      font-size: 12px;
      color: #8e8ea0;
      line-height: 1.3;
    }

    /* ========== 主内容区 ========== */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      background: #ffffff;
      position: relative;
    }

    /* 顶栏 */
    .top-bar {
      height: 56px;
      min-height: 56px;
      display: flex;
      flex-direction: row;
      align-items: center;
      padding: 0 12px;
    }

    .model-selector {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 8px;
      transition: background 150ms;
    }
    .model-selector:hover {
      background: rgba(0, 0, 0, 0.05);
    }
    .model-selector .title {
      font-size: 18px;
      font-weight: 700;
      color: #0d0d0d;
    }
    .model-selector svg {
      width: 16px;
      height: 16px;
      color: #6e6e80;
    }

    .top-bar-right {
      flex: 1;
    }

    /* 对话气泡图标按钮 */
    .chat-bubble-btn {
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      cursor: pointer;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6e6e80;
    }
    .chat-bubble-btn:hover {
      background: rgba(0, 0, 0, 0.05);
    }

    /* ========== 空状态欢迎区 ========== */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
    }

    /* Logo 图标 */
    .welcome-logo {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #19c37d;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .welcome-title {
      font-size: 28px;
      font-weight: 700;
      color: #0d0d0d;
    }

    .welcome-subtitle {
      font-size: 16px;
      color: #6e6e80;
    }

    /* 提示卡片网格 */
    .prompt-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      max-width: 640px;
      width: 100%;
      gap: 12px;
      padding: 0 24px;
    }

    /* 单张提示卡片 */
    .prompt-card {
      background: #ffffff;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      padding: 16px 20px;
      cursor: pointer;
      transition: background 200ms, border-color 200ms;
    }
    .prompt-card:hover {
      background: #f7f7f8;
      border-color: #d0d0d8;
    }
    .prompt-card .card-title {
      font-size: 14px;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 4px;
    }
    .prompt-card .card-desc {
      font-size: 12px;
      color: #8e8ea0;
    }

    /* ========== 底部输入区 ========== */
    .input-area {
      padding: 12px 24px 16px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 输入框容器 */
    .input-container {
      max-width: 768px;
      width: 100%;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 12px;
      background: #ffffff;
    }

    /* 输入文本框 */
    .input-container textarea {
      width: 100%;
      border: none;
      outline: none;
      resize: none;
      font-family: inherit;
      font-size: 15px;
      line-height: 1.5;
      color: #0d0d0d;
      background: transparent;
      min-height: 24px;
      max-height: 200px;
    }
    .input-container textarea::placeholder {
      color: #9ca3af;
    }

    /* 底部工具栏 */
    .input-toolbar {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
    }

    .toolbar-left {
      min-height: 32px;
    }

    .toolbar-right {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 4px;
    }

    /* 语音按钮 */
    .voice-btn {
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      cursor: pointer;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #9ca3af;
    }
    .voice-btn:hover {
      background: rgba(0, 0, 0, 0.05);
    }

    /* 发送按钮 */
    .send-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #e5e5e5;
      border: none;
      cursor: not-allowed;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
    }

    /* 底部提示文字 */
    .input-disclaimer {
      font-size: 11px;
      color: #9ca3af;
      text-align: center;
      margin-top: 12px;
    }
  </style>
</body>
</html>
